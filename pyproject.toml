[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bltail"
version = "0.3.0"
description = "Boundary layer tails in periodic homogenization via the commutator-Riccati cell problem"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Shari Moskow"}]
requires-python = ">=3.9"
dependencies = ["numpy>=1.22", "scipy>=1.8"]

[project.optional-dependencies]
examples = ["matplotlib"]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["bltail*"]
